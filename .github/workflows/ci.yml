name: CI Pipeline - IoT Environmental Monitoring

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  firmware-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Firmware Syntax
        run: |
          g++ -I firmware/include -fsyntax-only -Wall -Wextra -Werror firmware/src/main.cpp

  backend-daemon-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Daemon Unit Tests (PTY simulation)
        run: |
          cd daemon
          python3 -m py_compile ingestion_daemon.py
          python3 test_daemon.py
      - name: Verify ML Anomaly Detector Benchmark
        run: |
          cd backend/sensors/ml
          python3 -m py_compile detector.py train_isolation_forest.py
          python3 train_isolation_forest.py
      - name: Run Django REST Framework & Channels Test Suite
        run: |
          cd backend
          pip install --no-cache-dir django djangorestframework django-cors-headers channels daphne
          python3 manage.py test sensors
          python3 sensors/tests/verify_live_pipeline.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
